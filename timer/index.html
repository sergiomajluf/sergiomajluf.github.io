<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporizador de Flujo de Trabajo</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent-blue: #0071e3;
            --accent-red: #ff3b30;
            --accent-green: #34c759;
            --accent-orange: #ff9500;
            --divider: #d2d2d7;
            --focus-ring: rgba(0, 113, 227, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header & Main Display */
        .timer-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .timer-card.active {
            box-shadow: 0 20px 60px rgba(0, 113, 227, 0.15);
        }

        .phase-label {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .main-time {
            font-size: 96px;
            font-weight: 200;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            margin: 10px 0;
            letter-spacing: -2px;
        }

        .total-time {
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 10px;
        }

        /* Progress Bar */
        .progress-container {
            height: 6px;
            background: #e5e5ea;
            border-radius: 3px;
            margin: 30px 0 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent-blue);
            width: 0%;
            transition: width 1s linear;
        }

        /* Controls */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: #f2f2f7;
            color: var(--text-primary);
        }

        .btn:hover:not(:disabled) {
            transform: scale(1.02);
            filter: brightness(0.95);
        }

        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--accent-blue);
            color: white;
        }

        .btn-danger {
            background: #fff0f0;
            color: var(--accent-red);
        }

        .btn-danger:hover {
            background: #ffe5e5;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Config Section */
        .config-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        .config-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .config-title {
            font-size: 20px;
            font-weight: 700;
        }

        .config-toggle-icon {
            transition: transform 0.3s;
        }

        .config-content {
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        .config-content.open {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .timer-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toggle-setting {
            margin-bottom: 20px;
            padding: 16px;
            background: #f9f9f9;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toggle-setting input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-blue);
        }

        .toggle-setting span {
            font-size: 15px;
            color: var(--text-primary);
            font-weight: 600;
        }

        .timer-row {
            display: grid;
            grid-template-columns: 1fr 80px 80px 40px;
            gap: 10px;
            align-items: center;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 12px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .timer-row.active-phase {
            background: rgba(0, 113, 227, 0.12);
            border: 1px solid rgba(0, 113, 227, 0.25);
        }

        .timer-row input {
            padding: 8px 12px;
            border: 1px solid transparent;
            border-radius: 8px;
            background: white;
            font-size: 14px;
            width: 100%;
            text-align: center;
        }

        .timer-row input.name-input {
            text-align: left;
        }

        .timer-row input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .timer-row label {
            font-size: 10px;
            color: var(--text-secondary);
            text-align: center;
            display: block;
            margin-bottom: 4px;
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .remove-btn:hover {
            color: var(--accent-red);
        }

        .add-btn {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #f2f2f7;
            border: 2px dashed #d2d2d7;
            border-radius: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-btn:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            background: rgba(0, 113, 227, 0.05);
        }

        /* Status Colors */
        .status-running .main-time {
            color: var(--text-primary);
        }

        .status-warning .main-time {
            color: var(--accent-orange);
        }

        .status-overtime .main-time {
            color: var(--accent-red);
        }

        .status-finished .main-time {
            color: var(--accent-green);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .main-time {
                font-size: 72px;
            }

            .timer-row {
                grid-template-columns: 1fr 60px 60px 30px;
                gap: 5px;
            }

            .timer-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="main-container">
        <div class="timer-card" id="timerCard">
            <div class="phase-label" id="phaseLabel">Listo</div>
            <div class="main-time" id="mainDisplay">00:00</div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="total-time">
                Total restante: <span id="totalDisplay">00:00</span>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="startPauseBtn">Iniciar</button>
                <button class="btn" id="nextBtn">Siguiente</button>
                <button class="btn btn-danger" id="resetBtn">Reiniciar</button>
            </div>
        </div>

        <div class="config-card">
            <div class="config-header" onclick="toggleConfig()">
                <div class="config-title">Configuración</div>
                <div class="config-toggle-icon" id="configIcon">▼</div>
            </div>
            <div class="config-content open" id="configContent">
                <div class="toggle-setting">
                    <label>
                        <input type="checkbox" id="autoAdvanceToggle" onchange="setAutoAdvance(this.checked)">
                        <span>Avanzar automáticamente entre fases</span>
                    </label>
                </div>
                <div class="timer-list" id="timerList">
                    <!-- Timer rows will be injected here -->
                </div>
                <button class="add-btn" onclick="addTimerRow()">+ Agregar Timer</button>
            </div>
        </div>
    </div>

    <script>
        // State
        let timers = [
            { name: "Presentación", duration: 3, warning: 1 },
            { name: "Preguntas", duration: 3, warning: 1 }
        ];

        let currentTimerIndex = 0;
        let timeRemaining = 0;
        let totalTimeRemaining = 0;
        let isRunning = false;
        let intervalId = null;
        let isOvertime = false;
        let phaseComplete = false;
        let autoAdvance = true;

        // DOM Elements
        const phaseLabel = document.getElementById('phaseLabel');
        const mainDisplay = document.getElementById('mainDisplay');
        const totalDisplay = document.getElementById('totalDisplay');
        const progressBar = document.getElementById('progressBar');
        const timerCard = document.getElementById('timerCard');
        const startPauseBtn = document.getElementById('startPauseBtn');
        const nextBtn = document.getElementById('nextBtn');
        const timerListEl = document.getElementById('timerList');
        const autoAdvanceToggle = document.getElementById('autoAdvanceToggle');

        // Initialization
        function init() {
            loadSettings();
            autoAdvanceToggle.checked = autoAdvance;
            renderConfig();
            resetAll();
        }

        function loadSettings() {
            const saved = localStorage.getItem('timerConfig');
            if (saved) {
                try {
                    const settings = JSON.parse(saved);
                    if (Array.isArray(settings.timers)) {
                        timers = settings.timers;
                    }
                    if (typeof settings.autoAdvance === 'boolean') {
                        autoAdvance = settings.autoAdvance;
                    }
                } catch (e) {
                    console.error("Error loading settings", e);
                }
            }
        }

        function saveSettings() {
            localStorage.setItem('timerConfig', JSON.stringify({ timers, autoAdvance }));
        }

        // Timer Logic
        let lastTick = 0;

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            startPauseBtn.textContent = "Pausar";
            startPauseBtn.style.background = "var(--text-secondary)";

            lastTick = Date.now();

            intervalId = setInterval(() => {
                const now = Date.now();
                const delta = (now - lastTick) / 1000;
                lastTick = now;

                timeRemaining -= delta;
                totalTimeRemaining -= delta;

                if (timeRemaining <= 0 && !isOvertime) {
                    if (autoAdvance) {
                        nextPhase();
                        return;
                    }

                    if (!phaseComplete) {
                        timeRemaining = 0;
                        phaseComplete = true;
                        calculateTotalTime();
                        pauseTimer();
                        updateDisplay();
                        return;
                    }
                }

                if (timeRemaining < 0 && !isOvertime) {
                    isOvertime = true;
                }

                updateDisplay();
            }, 100);
        }

        function pauseTimer() {
            if (!isRunning) return;
            isRunning = false;
            clearInterval(intervalId);
            startPauseBtn.textContent = "Continuar";
            startPauseBtn.style.background = "var(--accent-blue)";
        }

        function toggleTimer() {
            if (isRunning) pauseTimer();
            else startTimer();
        }

        function nextPhase() {
            if (currentTimerIndex < timers.length - 1) {
                currentTimerIndex++;
                loadPhase(currentTimerIndex);
            } else {
                finish();
            }
        }

        function resetAll() {
            pauseTimer();
            currentTimerIndex = 0;
            startPauseBtn.textContent = "Iniciar";
            startPauseBtn.style.background = "var(--accent-blue)";
            loadPhase(0);
            calculateTotalTime();
            updateDisplay();
        }

        function loadPhase(index) {
            if (index >= timers.length) return;

            const timer = timers[index];
            timeRemaining = timer.duration * 60;
            isOvertime = false;
            phaseComplete = false;

            calculateTotalTime();
            renderConfig();
            updateDisplay();
        }

        function calculateTotalTime() {
            let total = 0;
            if (!isOvertime) {
                total += timeRemaining;
            }

            for (let i = currentTimerIndex + 1; i < timers.length; i++) {
                total += timers[i].duration * 60;
            }
            totalTimeRemaining = total;
        }

        function finish() {
            pauseTimer();
            phaseComplete = false;
            phaseLabel.textContent = "¡Terminado!";
            mainDisplay.textContent = "00:00";
            timerCard.className = "timer-card status-finished";
            startPauseBtn.disabled = true;
            nextBtn.disabled = true;
        }

        function updateDisplay() {
            const timer = timers[currentTimerIndex];

            phaseLabel.textContent = isOvertime ? `${timer.name} (Extra)` : timer.name;

            const absTime = Math.abs(timeRemaining);
            const mins = Math.floor(absTime / 60);
            const secs = Math.floor(absTime % 60);
            mainDisplay.textContent = `${isOvertime ? '+' : ''}${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

            const totalMins = Math.floor(Math.max(0, totalTimeRemaining) / 60);
            const totalSecs = Math.floor(Math.max(0, totalTimeRemaining) % 60);
            totalDisplay.textContent = `${String(totalMins).padStart(2, '0')}:${String(totalSecs).padStart(2, '0')}`;

            if (!isOvertime && timer.duration > 0) {
                const totalSeconds = timer.duration * 60;
                const progress = ((totalSeconds - timeRemaining) / totalSeconds) * 100;
                progressBar.style.width = `${progress}%`;
            } else if (isOvertime) {
                progressBar.style.width = '100%';
                progressBar.style.background = 'var(--accent-red)';
            }

            timerCard.className = 'timer-card active';
            if (isOvertime) {
                timerCard.classList.add('status-overtime');
            } else if (timeRemaining <= timer.warning * 60) {
                timerCard.classList.add('status-warning');
            } else {
                timerCard.classList.add('status-running');
            }

            nextBtn.disabled = currentTimerIndex >= timers.length - 1 && isOvertime;
            startPauseBtn.disabled = false;
        }

        // Configuration Logic
        function renderConfig() {
            timerListEl.innerHTML = '';
            timers.forEach((timer, index) => {
                const row = document.createElement('div');
                row.className = `timer-row${index === currentTimerIndex ? ' active-phase' : ''}`;
                row.innerHTML = `
                <div>
                    ${index === 0 ? '<label>Nombre</label>' : ''}
                    <input type="text" class="name-input" value="${timer.name}" onchange="updateTimer(${index}, 'name', this.value)">
                </div>
                <div>
                    ${index === 0 ? '<label>Minutos</label>' : ''}
                    <input type="number" value="${timer.duration}" min="1" onchange="updateTimer(${index}, 'duration', this.value)">
                </div>
                <div>
                    ${index === 0 ? '<label>Alerta</label>' : ''}
                    <input type="number" value="${timer.warning}" min="0" onchange="updateTimer(${index}, 'warning', this.value)">
                </div>
                <div>
                    ${index === 0 ? '<label>&nbsp;</label>' : ''}
                    <button class="remove-btn" onclick="removeTimer(${index})" title="Eliminar">×</button>
                </div>
            `;
                timerListEl.appendChild(row);
            });
        }

        function addTimerRow() {
            timers.push({ name: "Nueva Fase", duration: 5, warning: 1 });
            saveSettings();
            renderConfig();
        }

        function removeTimer(index) {
            if (timers.length <= 1) return;
            timers.splice(index, 1);
            saveSettings();
            renderConfig();
        }

        // Exposed to window for HTML onclick attributes
        window.updateTimer = function (index, field, value) {
            if (field === 'duration' || field === 'warning') {
                value = parseInt(value) || 0;
            }
            timers[index][field] = value;
            saveSettings();

            if (!isRunning && index === currentTimerIndex) {
                loadPhase(currentTimerIndex);
            } else {
                calculateTotalTime();
                updateDisplay();
            }
        };

        window.setAutoAdvance = function (value) {
            autoAdvance = value;
            saveSettings();
        };

        window.removeTimer = removeTimer;
        window.addTimerRow = addTimerRow;
        window.toggleConfig = function () {
            const content = document.getElementById('configContent');
            const icon = document.getElementById('configIcon');
            content.classList.toggle('open');
            icon.style.transform = content.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
        };

        // Event Listeners
        startPauseBtn.addEventListener('click', toggleTimer);
        nextBtn.addEventListener('click', nextPhase);
        resetBtn.addEventListener('click', resetAll);

        // Initial Run
        init();

    </script>
</body>

</html>
